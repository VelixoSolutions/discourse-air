hide_sidebar:
  type: bool
  default: true

sidebar_for_staff:
  type: bool
  default: true

nav_links:
  type: objects
  default: []
  schema:
    name: "link"
    identifier: "label"
    properties:
      label:
        type: string
        required: true
      url:
        type: string
        required: true
      icon:
        type: string
      audience:
        type: enum
        default: everyone
        choices:
          - everyone
          - logged_in
          - anonymous
          - staff

hero_style:
  type: enum
  default: navy
  choices:
    - gradient
    - navy
    - light

show_banner_title:
  type: bool
  default: false

hero_eyebrow:
  type: string
  default: ""

hero_subtitle:
  type: string
  default: "Ask questions, share reports and ideas, and learn from finance teams who use Velixo every day."

hero_links:
  type: objects
  default:
    - label: "Ask a question"
      url: "/new-topic?category=q-a"
      icon: "circle-question"
      audience: "everyone"
    - label: "Share an idea"
      url: "/c/ideas-feature-requests/7"
      icon: "rocket"
      audience: "everyone"
    - label: "Help Center"
      url: "https://www.velixo.com/help/"
      icon: "life-ring"
      audience: "everyone"
    - label: "Velixo Academy"
      url: "https://learning.velixo.com/"
      icon: "graduation-cap"
      audience: "everyone"
  schema:
    name: "link"
    identifier: "label"
    properties:
      label:
        type: string
        required: true
      url:
        type: string
        required: true
      icon:
        type: string
      audience:
        type: enum
        default: everyone
        choices:
          - everyone
          - logged_in
          - anonymous
          - staff

category_box_icons:
  type: bool
  default: true

show_footer:
  type: bool
  default: true

footer_copyright:
  type: string
  default: "Velixo All rights reserved"

footer_legal_links:
  type: objects
  default:
    - label: "Terms of Use"
      url: "https://www.velixo.com/terms-of-use/"
    - label: "Privacy Policy"
      url: "https://www.velixo.com/privacy-policy-june-2026/"
    - label: "Legal"
      url: "https://www.velixo.com/agreements/"
  schema:
    name: "link"
    identifier: "label"
    properties:
      label:
        type: string
        required: true
      url:
        type: string
        required: true

highlight_staff_posts:
  type: bool
  default: true

staff_badge_label:
  type: string
  default: "Velixo Team"
