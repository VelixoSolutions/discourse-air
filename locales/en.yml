en:
  theme_metadata:
    description: "Velixo community theme, based on Discourse Air, with a simple top navigation bar instead of the sidebar."
    settings:
      hide_sidebar: "Hide the sidebar and the hamburger button. Navigation is provided by the links in the header instead."
      sidebar_for_staff: "Keep the hamburger and sidebar for staff (admins and moderators) even when the sidebar is hidden for everyone else. The admin area relies on it for navigation."
      nav_links: "Links shown in the header navigation bar (and in a scrollable strip under the header on small screens)."
      hero_style: "Banner style. gradient: navy-to-blue gradient wave. navy: solid navy matching velixo.com. light: pale blue band with navy text."
      hero_eyebrow: "Small label shown above the banner title. Leave empty to hide it."
      hero_subtitle: "One line under the banner title. Leave empty to hide it."
      hero_links: "Quick-action buttons shown under the banner search box."
      show_footer: "Show the footer line with the copyright and legal links."
      show_banner_title: "Show the welcome banner title (\"Welcome to …\" / \"Welcome, name!\"). When off, the subtitle leads the banner."
      category_box_icons: "Show each category's icon (set in the category's settings) on the category boxes instead of its abbreviation."
      highlight_staff_posts: "Highlight posts written by staff (admins and moderators), with a badge next to the author's name."
      staff_badge_label: "Text of the badge shown next to the author's name on staff posts. Leave empty for no badge."
      footer_copyright: "Text after the © year in the footer's bottom row."
      footer_legal_links: "Links in the footer's bottom row (Terms, Privacy, Legal)."
